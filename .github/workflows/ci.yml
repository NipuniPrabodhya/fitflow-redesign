name: FitFlow CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  documentation-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required project files
        run: |
          test -f README.md
          test -f docs/comparisons/tech-stack-summary.md
          test -f docs/comparisons/frontend-comparison.md
          test -f docs/comparisons/backend-database-auth-comparison.md
          test -f docs/comparisons/decision-matrix.md
          test -f docs/architecture/high-level-architecture.md
          test -f docs/adr/ADR-001-technology-stack.md
          test -f docs/hci/requirements.md
          test -f docs/hci/prototype-link.md

      - name: Repository structure verified
        run: echo "FitFlow repository structure is valid."